<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--/* Reusable head fragment: Bootstrap + custom CSS + page title */-->
<th:block th:fragment="head(title)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${title} + ' | Employee Management System'">Employee Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</th:block>

<!--/* Reusable navbar fragment. Pass in the current username (or null) from the controller */-->
<nav th:fragment="navbar(username)" class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/employees}">Employee Management System</a>
        <div class="d-flex align-items-center">
            <span class="text-light me-3" th:if="${username != null}">
                Logged in as <strong th:text="${username}">user</strong>
            </span>
            <form th:action="@{/logout}" method="post" class="d-inline">
                <button type="submit" class="btn btn-outline-light btn-sm">Logout</button>
            </form>
        </div>
    </div>
</nav>

</body>
</html>
