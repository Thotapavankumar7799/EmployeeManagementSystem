<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head(title='Employees')}"></head>
<body>

<nav th:replace="~{layout :: navbar(username=${username})}"></nav>

<div class="container">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Employees</h2>
        <a th:if="${isAdmin}" th:href="@{/employees/new}" class="btn btn-primary">+ Add Employee</a>
    </div>

    <div class="alert alert-success" th:if="${message}" th:text="${message}"></div>

    <div class="table-responsive">
        <table class="table table-striped table-hover align-middle bg-white">
            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Full Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Department</th>
                <th>Designation</th>
                <th>Salary</th>
                <th th:if="${isAdmin}">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="employee : ${employees}">
                <td th:text="${employee.id}"></td>
                <td th:text="${employee.fullName}"></td>
                <td th:text="${employee.email}"></td>
                <td th:text="${employee.phone}"></td>
                <td th:text="${employee.department}"></td>
                <td th:text="${employee.designation}"></td>
                <td th:text="${#numbers.formatDecimal(employee.salary, 1, 2)}"></td>
                <td th:if="${isAdmin}">
                    <a th:href="@{/employees/edit/{id}(id=${employee.id})}"
                       class="btn btn-sm btn-outline-secondary">Edit</a>
                    <a th:href="@{/employees/delete/{id}(id=${employee.id})}"
                       class="btn btn-sm btn-outline-danger"
                       onclick="return confirm('Delete this employee?');">Delete</a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(employees)}">
                <td colspan="8" class="text-center text-muted">No employees found.</td>
            </tr>
            </tbody>
        </table>
    </div>

</div>

</body>
</html>
