<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head(title=${employee.id != null ? 'Edit Employee' : 'Add Employee'})}"></head>
<body>

<nav th:replace="~{layout :: navbar(username=${username})}"></nav>

<div class="container" style="max-width: 640px;">

    <h2 th:text="${employee.id != null ? 'Edit Employee' : 'Add Employee'}"></h2>

    <form th:action="@{/employees/save}" th:object="${employee}" method="post" class="card card-body shadow-sm">

        <input type="hidden" th:field="*{id}"/>

        <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input type="text" th:field="*{fullName}" class="form-control"/>
            <div class="text-danger small" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" th:field="*{email}" class="form-control"/>
            <div class="text-danger small" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Phone</label>
            <input type="text" th:field="*{phone}" class="form-control"/>
            <div class="text-danger small" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Department</label>
            <input type="text" th:field="*{department}" class="form-control"/>
            <div class="text-danger small" th:if="${#fields.hasErrors('department')}" th:errors="*{department}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Designation</label>
            <input type="text" th:field="*{designation}" class="form-control"/>
            <div class="text-danger small" th:if="${#fields.hasErrors('designation')}" th:errors="*{designation}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Salary</label>
            <input type="number" step="0.01" th:field="*{salary}" class="form-control"/>
            <div class="text-danger small" th:if="${#fields.hasErrors('salary')}" th:errors="*{salary}"></div>
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Save</button>
            <a th:href="@{/employees}" class="btn btn-secondary">Cancel</a>
        </div>

    </form>

</div>

</body>
</html>
