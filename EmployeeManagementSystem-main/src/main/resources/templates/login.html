<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head(title='Login')}"></head>
<body>

<div class="container" style="max-width: 420px; margin-top: 80px;">
    <div class="card shadow-sm">
        <div class="card-body">
            <h3 class="card-title mb-4 text-center">Employee Management System</h3>

            <div class="alert alert-danger" th:if="${param.error}">
                Invalid username or password.
            </div>
            <div class="alert alert-success" th:if="${param.logout}">
                You have been logged out.
            </div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-control" required autofocus/>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" required/>
                </div>
                <button type="submit" class="btn btn-primary w-100">Login</button>
            </form>

            <hr/>
            <p class="text-muted small mb-0">
                Demo accounts:<br/>
                Admin &mdash; username: <code>admin</code>, password: <code>admin123</code><br/>
                Viewer &mdash; username: <code>viewer</code>, password: <code>viewer123</code>
            </p>
        </div>
    </div>
</div>

</body>
</html>
